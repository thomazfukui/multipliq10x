# Configuração da automação de NFS-e.
# Copie para config.yaml e ajuste. Segredos (certificado, senhas, chaves) ficam no .env.

# "homologacao" = Produção Restrita do Emissor Nacional (notas de teste, sem valor fiscal)
# "producao"    = notas reais
ambiente: homologacao

# manual     = cada nota fica pendente até você rodar `python -m nfse_auto aprovar <id>`
# automatico = emite e envia sozinho (só quando a extração for confiável; senão volta para manual)
modo_aprovacao: manual

# E-mail que recebe as prévias para aprovação e os alertas de erro
email_responsavel: seuemail@gmail.com

prestador:
  cnpj: "10947101000128"
  razao_social: L.D.T. COMUNICACAO VISUAL LTDA
  municipio_ibge: "4113700"        # Londrina/PR
  inscricao_municipal: ""           # opcional
  # Simples Nacional — ME/EPP
  op_simples_nacional: 3            # 1=Não optante, 2=MEI, 3=ME/EPP
  regime_apuracao_sn: 1             # 1=Tributos federais e municipal pelo SN
  regime_especial: 0                # 0=Nenhum

# Alíquota do Simples Nacional por mês de competência (AAAA-MM).
# Se o mês da nota não estiver aqui, a automação NÃO emite e avisa você.
aliquota_simples_por_mes:
  "2026-11": 2.01

dps:
  serie: "1"
  # Próximo número de DPS. A automação incrementa sozinha (salvo em dados/estado.db).
  numero_inicial: 1
  versao_layout: "1.00"

# Cada cliente: como reconhecer o e-mail do relatório e como montar a nota.
clientes:
  - id: consorcio_roma
    nome: Consórcio Roma
    # E-mail que traz o relatório: a Roma manda um por representante, todos com o mesmo
    # assunto. O seu é reconhecido pelo nome da empresa no corpo e pelo PDF cujo nome
    # começa com o seu CNPJ (ex.: 1094710100012810AFED7F-....PDF).
    email_remetentes:
      - consorcioroma@consorcioroma.com.br
    email_assunto_contem: "RELATÓRIO DE COMISSÃO EM ANEXO"
    email_corpo_contem: "L.D.T. COMUNICACAO VISUAL LTDA"
    anexo_prefixo: "10947101000128"
    # Limites de segurança: fora disso a nota volta para aprovação manual
    valor_minimo: 1.00
    valor_maximo: 50000.00

    tomador:
      cnpj: "61550836000154"
      razao_social: COOPERATIVA MISTA ROMA
      telefone: "1148103399"
      email: comissao@consorcioroma.com.br

    servico:
      codigo_tributacao_nacional: "170601"   # 17.06.01 Propaganda e publicidade...
      codigo_nbs: "114061900"                # Serviços de propaganda não classificados...
      municipio_prestacao_ibge: "4113700"    # Londrina/PR
      # {periodo_inicio} e {periodo_fim} vêm do relatório (dd/mm/aaaa).
      # Se o relatório não trouxer o início, usa periodo_inicio_padrao.
      periodo_inicio_padrao: "01/08/2025"
      descricao: |-
        Comissão sobre Vendas de Cotas de Consórcio
        Referente ao período: {periodo_inicio} até {periodo_fim}

        Estes são os dados da minha conta:

        Banco: 336 - Banco C6 S.A.
        Agência: 0001
        Conta corrente: 5385083-1
        CNPJ: 10.947.101/0001-28
        Nome: K/B AGENCY
        Chave Pix: 10.947.101/0001-28

        Responsável: Thomaz Kazuhiko Fukui

    # E-mail de envio da nota — mesmo padrão dos envios manuais
    # (ex.: "RELATÓRIO DE COMISSÃO <> L.D.T. COMUNICACAO VISUAL LTDA (até 22/10/2026)").
    # Campos disponíveis: {periodo_inicio} {periodo_fim} {valor} {numero_nfse} {chave_acesso}
    envio:
      responder_no_fio: false          # e-mail novo (o remetente do relatório não é monitorado)
      para:
        - comissao@consorcioroma.com.br
      cc: []
      anexar_relatorio: true           # anexa o PDF do relatório recebido
      anexar_xml: false                # o padrão manual só manda o PDF da nota
      confirmacao_leitura: false       # a Roma sugere pedir confirmação de leitura (item g)
      # Se você já mandou um e-mail com este assunto (nota feita manualmente), não emite de novo.
      pular_se_ja_enviado: true
      assunto: "RELATÓRIO DE COMISSÃO <> L.D.T. COMUNICACAO VISUAL LTDA (até {periodo_fim})"
      corpo: |-
        Bom dia! Aqui vai a nota fiscal referente a Comissão sobre Vendas de Cotas de Consórcio.

        Períodos apurados: {periodo_inicio} até {periodo_fim}
        Valor: R$ {valor}

        Estes são os dados da minha conta:

        Banco: 336 - Banco C6 S.A.
        Agência: 0001
        Conta corrente: 5385083-1
        CNPJ: 10.947.101/0001-28
        Nome: K/B AGENCY
        Chave Pix: 10.947.101/0001-28

        Responsável: Thomaz Kazuhiko Fukui

        Anexos:
        - Nota fiscal nº {numero_nfse}
        - Relatório de Comissão

        Qualquer dúvida estou a disposição

        Atenciosamente,

        Thomaz Fukui
        (43) 999510083
      corpo_html: |-
        <div dir="ltr" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">
        <p style="margin:0">Bom dia! Aqui vai a nota fiscal referente a <b>Comissão sobre Vendas de Cotas de Consórcio.</b></p>
        <br>
        <span style="background-color:rgb(0,255,255)">Períodos apurados: {periodo_inicio} até <b>{periodo_fim}</b></span><br>
        <span style="background-color:rgb(0,255,255)">Valor: <b>R$ {valor}</b></span>
        <br><br>
        <p style="margin:0"><b>Estes são os dados da minha conta:</b></p>
        <br>
        <p style="margin:0">Banco: 336 - Banco C6 S.A.</p>
        <p style="margin:0">Agência: 0001</p>
        <p style="margin:0">Conta corrente: 5385083-1</p>
        <p style="margin:0">CNPJ: 10.947.101/0001-28</p>
        <p style="margin:0">Nome: K/B AGENCY</p>
        <p style="margin:0">Chave Pix: 10.947.101/0001-28</p>
        <br>
        <p style="margin:0">Responsável: Thomaz Kazuhiko Fukui</p>
        <br><br>
        <p style="margin:0"><b>Anexos:</b><br>- Nota fiscal nº {numero_nfse}<br>- Relatório de Comissão</p>
        <br><br>
        <p style="margin:0">Qualquer dúvida estou a disposição<br><br>Atenciosamente,<br><br><b>Thomaz Fukui</b><br><i>(43) 999510083</i></p>
